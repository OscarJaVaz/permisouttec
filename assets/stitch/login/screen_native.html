<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "institutional-gold": "#C5A358",
                    "surface-container": "#edeeef",
                    "on-tertiary-fixed-variant": "#703532",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#f8f9fa",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#251a00",
                    "tertiary-fixed": "#ffdad7",
                    "secondary-container": "#fed887",
                    "surface-container-low": "#f3f4f5",
                    "surface-container-highest": "#e1e3e4",
                    "inverse-surface": "#2e3132",
                    "tertiary": "#4c1a18",
                    "surface-tint": "#2b694f",
                    "error-container": "#ffdad6",
                    "on-surface-variant": "#404943",
                    "on-primary-container": "#7ab99a",
                    "surface-dim": "#d9dadb",
                    "tertiary-container": "#682f2c",
                    "surface-variant": "#e1e3e4",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#f0f1f2",
                    "secondary": "#765a16",
                    "on-secondary-fixed-variant": "#5b4300",
                    "tertiary-fixed-dim": "#ffb3ae",
                    "academic-slate": "#333E48",
                    "on-primary-fixed-variant": "#0c5138",
                    "primary-container": "#004a32",
                    "surface-container-lowest": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e7e8e9",
                    "inverse-primary": "#94d4b4",
                    "background": "#f8f9fa",
                    "on-error-container": "#93000a",
                    "outline-variant": "#bfc9c1",
                    "secondary-fixed-dim": "#e6c274",
                    "surface": "#f8f9fa",
                    "secondary-fixed": "#ffdf9d",
                    "on-primary-fixed": "#002114",
                    "on-background": "#191c1d",
                    "deep-emerald": "#004A32",
                    "on-surface": "#191c1d",
                    "paper-white": "#FFFFFF",
                    "outline": "#707973",
                    "on-secondary-container": "#785d18",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#94d4b4",
                    "surface-subtle": "#EDF0F2",
                    "primary-fixed": "#b0f0cf",
                    "on-tertiary-container": "#e79792",
                    "primary": "#003120",
                    "on-tertiary-fixed": "#390b0a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "margin-desktop": "48px",
                    "gutter": "24px",
                    "margin-mobile": "20px",
                    "section-gap": "64px"
            },
            "fontFamily": {
                    "display-lg": ["Montserrat"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Montserrat"],
                    "headline-lg-mobile": ["Montserrat"],
                    "title-md": ["Montserrat"],

                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]

          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col selection:bg-deep-emerald selection:text-white">
<div class="flex-grow flex flex-col px-margin-mobile pt-12 pb-8">
<header class="flex flex-col items-center mb-10">
<div class="relative w-32 h-32 mb-6 group">
<div class="absolute inset-0 bg-deep-emerald/5 rounded-full scale-110 blur-xl"></div>
<img alt="UTT Institutional Logo" class="relative z-10 w-full h-full object-contain" data-alt="The official institutional shield of the Universidad Tecnológica de Tecámac, featuring geometric green and gold elements against a clean white background. The logo is centered and illuminated with soft, professional studio lighting that emphasizes its clean architectural lines and academic prestige. The image has a high-key, minimalist corporate aesthetic consistent with institutional trust." src="https://lh3.googleusercontent.com/aida-public/AB6AXuChH1E22-tEhJkwvvu1pBcboq2ta6tmun6tYVlaqAC47R4ZEVtS98803hHecSwsL2vNMfCUbfd3ag8jXhBnQgvHDLKNW8dhjd49ew_kUYxw1Yn4diE85afv24YNR2mw1xeu_lL3RgpQ9bTYV8H-_vlODov-_rrcukK9USBSNkx_zkE4wM4oPAlDaOuMk703STg6k4jwTaCa5iy6aeEIomxlkT7NN8obibRc0td8hDVDkv_4pr9a3qTb-TMn1f2KCa3LWCuRivngwKfI"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-deep-emerald text-center">
                Entrar al sistema
            </h1>
<p class="font-body-md text-on-surface-variant text-center mt-2 opacity-80">
                Plataforma Institucional Educativa
            </p>
</header>
<main class="w-full max-w-sm mx-auto space-y-6">
<form class="space-y-5" id="loginForm">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant block ml-1 uppercase tracking-wider" for="username">
                        Usuario o Matrícula
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-deep-emerald transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-paper-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-deep-emerald focus:border-deep-emerald outline-none transition-all duration-200 text-body-md" id="username" name="username" placeholder="p. ej. 22001234" required="" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant block ml-1 uppercase tracking-wider" for="password">
                        Contraseña
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-deep-emerald transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full pl-12 pr-12 py-4 bg-paper-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-deep-emerald focus:border-deep-emerald outline-none transition-all duration-200 text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-deep-emerald active:scale-90 transition-all" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end pt-1">
<a class="text-secondary font-label-sm text-label-sm hover:underline decoration-institutional-gold underline-offset-4" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
<div class="pt-4">
<button class="w-full bg-deep-emerald text-white py-4 rounded-xl font-headline-lg-mobile text-body-lg shadow-lg shadow-deep-emerald/10 hover:bg-primary active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-3" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined">login</span>
</button>
</div>
</form>
<div class="pt-8 text-center">
<div class="flex items-center justify-center gap-2 mb-6">
<div class="h-[1px] w-12 bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase">Otras opciones</span>
<div class="h-[1px] w-12 bg-outline-variant"></div>
</div>
<button class="w-full border border-outline-variant text-on-surface-variant py-4 rounded-xl font-label-sm text-body-md hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3">
<span class="material-symbols-outlined">fingerprint</span>
                    Acceso Biométrico
                </button>
</div>
</main>
</div>
<footer class="mt-auto py-8 bg-surface-subtle border-t border-outline-variant">
<div class="px-margin-mobile text-center space-y-3">
<div class="flex justify-center items-center gap-2 text-deep-emerald opacity-60">
<span class="material-symbols-outlined text-[18px]">school</span>
<p class="font-label-sm text-label-sm uppercase tracking-tighter">
                    Universidad Tecnológica de Tecámac
                </p>
</div>
<div class="flex flex-wrap justify-center gap-x-4 gap-y-2">
<a class="font-label-sm text-label-sm text-outline hover:text-deep-emerald" href="#">Aviso de Privacidad</a>
<span class="text-outline-variant">•</span>
<a class="font-label-sm text-label-sm text-outline hover:text-deep-emerald" href="#">Ayuda</a>
<span class="text-outline-variant">•</span>
<span class="font-label-sm text-label-sm text-outline opacity-50">v3.4.0</span>
</div>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Validando...';
            
            setTimeout(() => {
                btn.classList.replace('bg-deep-emerald', 'bg-institutional-gold');
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> ¡Bienvenido!';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-institutional-gold', 'bg-deep-emerald');
                }, 1500);
            }, 1000);
        });
    </script>
</body></html>
